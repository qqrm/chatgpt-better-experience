name: Setup Node and install npm dependencies

description: Sets up Node.js 24 with npm cache and installs dependencies via npm ci.

runs:
  using: composite
  steps:
    - name: Setup Node.js 24
      uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      shell: bash
      env:
        HUSKY: 0
      run: npm ci
