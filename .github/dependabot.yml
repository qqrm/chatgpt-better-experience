version: 2
multi-ecosystem-groups:
  maintenance:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
      timezone: "Europe/Moscow"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "maintenance"
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    # typescript-eslint currently supports TypeScript <6.1; remove when upstream supports it.
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.1"]
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "maintenance"
    cooldown:
      default-days: 7
    groups:
      security:
        applies-to: "security-updates"
        patterns: ["*"]
