name: Dependency Review

on:
  pull_request:
    paths-ignore:
      - config/extension/manifest.base.json

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Detect dependency graph support
        id: detect
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            try {
              await github.request("GET /repos/{owner}/{repo}/dependency-graph/sbom", {
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              core.setOutput("dependency_graph_supported", "true");
            } catch (error) {
              core.warning(
                `Dependency graph is unavailable for this repository (${error.status ?? "unknown"}). Falling back to npm audit gate.`
              );
              core.setOutput("dependency_graph_supported", "false");
            }

      - name: Dependency Review
        if: steps.detect.outputs.dependency_graph_supported == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4

      - name: Setup Node.js for fallback audit
        if: steps.detect.outputs.dependency_graph_supported != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Fallback dependency gate (npm audit)
        if: steps.detect.outputs.dependency_graph_supported != 'true'
        run: npm audit --audit-level=high --omit=dev --package-lock-only
