name: Dependency Review

on:
  pull_request:
    paths-ignore:
      - config/extension/manifest.base.json

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect dependency graph support
        id: detect
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            try {
              await github.request("GET /repos/{owner}/{repo}/dependency-graph/sbom", {
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              core.setOutput("dependency_graph_supported", "true");
            } catch (error) {
              core.warning(
                `Dependency graph is unavailable for this repository (${error.status ?? "unknown"}). Falling back to npm audit gate.`
              );
              core.setOutput("dependency_graph_supported", "false");
            }

      - name: Dependency Review
        if: steps.detect.outputs.dependency_graph_supported == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4

      - name: Setup Node.js for fallback audit
        if: steps.detect.outputs.dependency_graph_supported != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Fallback dependency gate (npm audit)
        if: steps.detect.outputs.dependency_graph_supported != 'true'
        run: npm audit --audit-level=high --omit=dev --package-lock-only
