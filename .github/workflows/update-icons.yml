name: Update Icons

on:
  workflow_dispatch: {}

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.AUTOMATION_BOT_TOKEN }}

      - name: Setup Node and install dependencies
        uses: ./.github/actions/setup-node-npm

      - name: Generate PNG icons
        run: npm run generate:icons

      - name: Commit updated icons
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.AUTOMATION_BOT_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain icons)" ]; then
            echo "No icon changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add icons
          git commit -m "chore: regenerate icon PNGs"
          git -c 'credential.helper=!gh auth git-credential' push origin "HEAD:$TARGET_BRANCH"
